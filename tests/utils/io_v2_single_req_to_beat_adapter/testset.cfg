from gvtest.testsuite import *

import re

SEND_RX = re.compile(r'^\[(\d+)\] master SEND ', re.MULTILINE)
RESP_RX = re.compile(r'^\[(\d+)\] master RESP .* status=(\d)', re.MULTILINE)
DONE_RX = re.compile(r'^\[(\d+)\] master DONE .* status=(\d)', re.MULTILINE)
QUIT_RX = re.compile(r'^\[\d+\] master QUIT', re.MULTILINE)
REQHOLD_RX = re.compile(r'^\[\d+\] master REQHOLD ', re.MULTILINE)
TGT_DENY_RX = re.compile(r'^\[\d+\] target DENY ', re.MULTILINE)
TGT_RETRY_RX = re.compile(r'^\[\d+\] target RETRY', re.MULTILINE)


def _make_check(resp=0, done=0, overlap=False, forbid_reqhold=False,
                denies=None):
    """Assert the run finished with exactly `resp` async completions and
    `done` inline completions (identity, status and data checks live in the
    stubs' traces.assert, active in asserts mode).

    overlap=True additionally asserts true pipelining: the first response
    lands BEFORE the last access is issued, i.e. several accesses were
    genuinely outstanding at once (the collapse adapter would have serialised
    them with REQHOLDs instead). forbid_reqhold asserts the adapter never
    back-pressured the master; denies=N asserts the downstream deny/retry
    handshake fired exactly N times and was propagated upstream (REQHOLD)."""
    def _check(test, output, *args, **kwargs):
        if not QUIT_RX.search(output):
            return False, 'no master QUIT line (sim aborted, hung, or assert fired)'
        resps = RESP_RX.findall(output)
        dones = DONE_RX.findall(output)
        if len(resps) != resp:
            return False, f'got {len(resps)} async completions, expected {resp}'
        if len(dones) != done:
            return False, f'got {len(dones)} inline completions, expected {done}'
        if overlap:
            # At least two accesses must be issued before the first completes:
            # since none has completed by then, they were genuinely outstanding
            # at the same time.
            sends = [int(c) for c in SEND_RX.findall(output)]
            first_resp = int(resps[0][0])
            concurrent = sum(1 for c in sends if c < first_resp)
            if concurrent < 2:
                return False, (f'no pipelining: only {concurrent} access(es) '
                               f'issued before the first completion at '
                               f'{first_resp} (sends: {sends})')
        if forbid_reqhold and REQHOLD_RX.search(output):
            return False, 'REQHOLD seen — accesses were serialised'
        if denies is not None:
            n_deny = len(TGT_DENY_RX.findall(output))
            n_retry = len(TGT_RETRY_RX.findall(output))
            n_hold = len(REQHOLD_RX.findall(output))
            if n_deny != denies or n_retry != denies:
                return False, (f'got {n_deny} denies / {n_retry} retries, '
                               f'expected {denies}')
            if n_hold != denies:
                return False, (f'deny not propagated upstream: {n_hold} '
                               f'REQHOLDs for {denies} denies')
        return True, f'{resp} async + {done} inline completions ok'
    return _check


def testset_build(testset):
    testset.set_name('io_v2_single_req_to_beat_adapter')
    testset.set_components(["utils.io_v2_single_req_to_beat_adapter"])

    def add(name, checker, desc):
        t = testset.new_make_test(name, flags=f'CASE={name}', checker=checker,
                                  build_resource='gvsoc.core.build', no_clean=True)
        t.add_description(desc)

    add('r1', _make_check(resp=1),
        "Beat-sized read: one distinct downstream beat, freed by the adapter; "
        "the master gets its own request back with the data in its buffer.")
    add('r_small', _make_check(resp=1),
        "Read smaller than the beat width: still exactly one response beat.")
    add('r_wide', _make_check(resp=1),
        "8 B access on a 4 B beat plane: two downstream beats reassembled into "
        "the master's buffer before the single identity response.")
    add('w1', _make_check(done=1),
        "Write forwarded as the master's own object; the inline DONE (with its "
        "latency annotation) is relayed untouched.")
    add('w_async', _make_check(resp=1),
        "Async write ack: the master's own object round-trips through the "
        "adapter as the response.")
    add('pipelined', _make_check(resp=4, overlap=True, forbid_reqhold=True),
        "Four back-to-back reads all outstanding concurrently: responses "
        "stream one per cycle overlapping the issue window, with no REQHOLD — "
        "the serialisation the collapse adapter would impose is gone.")
    add('pipelined_mix', _make_check(resp=4, overlap=True, forbid_reqhold=True),
        "Reads and async writes in flight together, each completion handed "
        "back on its own request object.")
    add('err', _make_check(done=1),
        "The beat slave reports IO_RESP_INVALID inline on the data-less read "
        "(the legal inline read completion): relayed inline to the master.")
    add('zero', _make_check(resp=1),
        "Degenerate zero-size read: one zero-size beat, one identity response.")
    add('deny', _make_check(resp=1, denies=1),
        "The target denies the forwarded request once: the adapter propagates "
        "the DENY upstream statelessly (REQHOLD) and forwards the retry; the "
        "master re-sends and the access completes.")
