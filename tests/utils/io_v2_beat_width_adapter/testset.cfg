from gvtest.testsuite import *

import re

# Upstream side (master log).
RESP_RX = re.compile(
    r'^\[(\d+)\] master RESP .* size=(\d+) first=(\d) last=(\d)', re.MULTILINE)
QUIT_RX = re.compile(r'^\[\d+\] master QUIT', re.MULTILINE)
DENY_RX = re.compile(r'^\[\d+\] master DENY ', re.MULTILINE)
RETRY_RX = re.compile(r'^\[\d+\] master RETRY', re.MULTILINE)
REQHOLD_RX = re.compile(r'^\[\d+\] master REQHOLD ', re.MULTILINE)
# Downstream side (target log).
TGT_BEAT_RX = re.compile(r'^\[(\d+)\] target BEAT .* size=(\d+)', re.MULTILINE)
TGT_WREQ_RX = re.compile(
    r'^\[(\d+)\] target REQ .* size=(\d+) write=1', re.MULTILINE)
TGT_BHOLD_RX = re.compile(r'^\[\d+\] target BHOLD', re.MULTILINE)
TGT_DENY_RX = re.compile(r'^\[\d+\] target DENY ', re.MULTILINE)
TGT_RETRY_RX = re.compile(r'^\[\d+\] target RETRY', re.MULTILINE)


def _cycles(matches):
    return [int(m[0]) for m in matches]


def _spacing_ok(cycles, spacing):
    return all(b - a == spacing for a, b in zip(cycles, cycles[1:]))


def _check_common(output, up_beats):
    """Run finished and the master observed exactly `up_beats` beats with
    correct first/last placement. Returns (beats, error_string_or_None)."""
    if not QUIT_RX.search(output):
        return None, 'no master QUIT line (sim aborted, hung, or assert fired)'
    beats = RESP_RX.findall(output)
    if len(beats) != up_beats:
        return None, f'got {len(beats)} upstream beats, expected {up_beats}'
    if beats[0][2] != '1':
        return None, 'first upstream beat does not have is_first=1'
    if beats[-1][3] != '1':
        return None, 'last upstream beat does not have is_last=1'
    return beats, None


def _make_read_check(up_beats, dn_beats, up_spacing=None, dn_spacing=None,
                     min_dn_span=None, expect_bhold=False, forbid_bhold=False):
    """Check the two sides of a read run their own bandwidth: `up_beats`
    upstream beats (optionally exactly `up_spacing` cycles apart) against
    `dn_beats` downstream beats (optionally exactly `dn_spacing` apart, or
    spanning at least `min_dn_span` cycles when throttled by back-pressure).
    `forbid_bhold` asserts the downstream producer was never denied (deep
    read FIFO absorbing the repacked backlog)."""
    def _check(test, output, *args, **kwargs):
        beats, err = _check_common(output, up_beats)
        if err:
            return False, err
        dn = TGT_BEAT_RX.findall(output)
        if len(dn) != dn_beats:
            return False, f'got {len(dn)} downstream beats, expected {dn_beats}'
        up_cycles = _cycles(beats)
        dn_cycles = _cycles(dn)
        if up_spacing is not None and not _spacing_ok(up_cycles, up_spacing):
            return False, f'upstream beats not {up_spacing} cycles apart: {up_cycles}'
        if dn_spacing is not None and not _spacing_ok(dn_cycles, dn_spacing):
            return False, f'downstream beats not {dn_spacing} cycles apart: {dn_cycles}'
        if min_dn_span is not None \
                and dn_cycles[-1] - dn_cycles[0] < min_dn_span:
            return False, (f'downstream not throttled: span '
                           f'{dn_cycles[-1] - dn_cycles[0]} < {min_dn_span}')
        if expect_bhold and not TGT_BHOLD_RX.search(output):
            return False, 'no target BHOLD (downstream back-pressure never engaged)'
        if forbid_bhold and TGT_BHOLD_RX.search(output):
            return False, ('target BHOLD seen — the read FIFO should have '
                           'absorbed the whole backlog without denying')
        return True, (f'{up_beats} up / {dn_beats} down beats, '
                      f'bandwidth split ok')
    return _check


def _make_write_check(up_acks, dn_chunks, ack_spacing=None, chunk_spacing=None,
                      expect_reqhold=False, forbid_reqhold=False):
    """Check the two sides of a write run their own bandwidth: `dn_chunks`
    downstream write beats (optionally exactly `chunk_spacing` apart) against
    `up_acks` upstream acks (optionally exactly `ack_spacing` apart).
    `forbid_reqhold` asserts the upstream writer was never denied (deep write
    FIFO absorbing the chunk backlog)."""
    def _check(test, output, *args, **kwargs):
        beats, err = _check_common(output, up_acks)
        if err:
            return False, err
        chunks = TGT_WREQ_RX.findall(output)
        if len(chunks) != dn_chunks:
            return False, f'got {len(chunks)} downstream chunks, expected {dn_chunks}'
        ack_cycles = _cycles(beats)
        chunk_cycles = _cycles(chunks)
        if ack_spacing is not None and not _spacing_ok(ack_cycles, ack_spacing):
            return False, f'acks not {ack_spacing} cycles apart: {ack_cycles}'
        if chunk_spacing is not None \
                and not _spacing_ok(chunk_cycles, chunk_spacing):
            return False, f'chunks not {chunk_spacing} cycles apart: {chunk_cycles}'
        if expect_reqhold and not REQHOLD_RX.search(output):
            return False, 'no REQHOLD (upstream write back-pressure never engaged)'
        if forbid_reqhold and REQHOLD_RX.search(output):
            return False, ('REQHOLD seen — the write FIFO should have absorbed '
                           'the whole burst without denying')
        return True, (f'{up_acks} acks / {dn_chunks} chunks, '
                      f'bandwidth split ok')
    return _check


def _make_bp_check(up_beats, expected_denies):
    """Upstream response back-pressure: the master denies beats, the adapter
    holds and re-sends each; all beats still land."""
    def _check(test, output, *args, **kwargs):
        beats, err = _check_common(output, up_beats)
        if err:
            return False, err
        denies = len(DENY_RX.findall(output))
        retries = len(RETRY_RX.findall(output))
        if denies != expected_denies:
            return False, f'got {denies} denied beats, expected {expected_denies}'
        if retries < denies:
            return False, f'got {retries} resp_retry() calls, expected >= {denies}'
        return True, f'{up_beats} beats; {denies} deny/retry handshakes'
    return _check


def _make_deny_check(up_beats, expected_denies, expect_reqhold):
    """Downstream request-path back-pressure: the target denies requests, the
    adapter holds/propagates and everything still completes."""
    def _check(test, output, *args, **kwargs):
        beats, err = _check_common(output, up_beats)
        if err:
            return False, err
        denies = len(TGT_DENY_RX.findall(output))
        retries = len(TGT_RETRY_RX.findall(output))
        if denies != expected_denies:
            return False, f'got {denies} target denies, expected {expected_denies}'
        if retries != expected_denies:
            return False, f'got {retries} target retry() calls, expected {expected_denies}'
        if expect_reqhold and not REQHOLD_RX.search(output):
            return False, 'no REQHOLD (the deny was not propagated upstream)'
        return True, f'{up_beats} beats; {denies} request-path deny/retry handshakes'
    return _check


def testset_build(testset):
    testset.set_name('io_v2_beat_width_adapter')
    testset.set_components(["utils.io_v2_beat_width_adapter"])

    def add(name, checker, desc):
        t = testset.new_make_test(name, flags=f'CASE={name}', checker=checker,
                                  build_resource='gvsoc.core.build', no_clean=True)
        t.add_description(desc)

    add('read_downsize',
        _make_read_check(4, 8, up_spacing=2, dn_spacing=1),
        "32 B read, 8 B master onto 4 B slave: the narrow side streams eight "
        "4 B beats every cycle while the wide side sees four 8 B beats every "
        "2 cycles — same bytes, different per-cycle occupancy.")
    add('read_upsize',
        _make_read_check(16, 8, up_spacing=1, min_dn_span=11, expect_bhold=True),
        "64 B read, 4 B master onto 8 B slave: the narrow upstream drains one "
        "beat per cycle while the wide downstream producer is throttled by "
        "response back-pressure to about one beat every 2 cycles.")
    add('read_short',
        _make_read_check(3, 5, dn_spacing=1),
        "20 B read at 8->4: short terminal beats on both sides (8+8+4 up, "
        "5x4 down), boundaries at cumulative offsets.")
    add('write_big_downsize',
        _make_write_check(4, 8, ack_spacing=2, chunk_spacing=1),
        "Big-packet 32 B write at 8->4: eight 4 B chunks stream one per cycle "
        "downstream; four 8 B acks land every 2 cycles upstream.")
    add('write_beats_downsize',
        _make_write_check(4, 8, chunk_spacing=1, expect_reqhold=True),
        "Beat-form 32 B write at 8->4: the upstream writer is back-pressured "
        "(DENIED + retry(WRITE)) to one 8 B beat every 2 cycles while the "
        "downstream streams a 4 B chunk every cycle.")
    add('write_beats_upsize',
        _make_write_check(8, 4, ack_spacing=1, chunk_spacing=2),
        "Beat-form 32 B write at 4->8: pairs of 4 B upstream beats are packed "
        "into one 8 B downstream chunk every 2 cycles; eight acks upstream.")
    add('write_big_upsize',
        _make_write_check(8, 4, ack_spacing=1, chunk_spacing=1),
        "Big-packet 32 B write at 4->8: the whole payload is available at "
        "once, so the four 8 B downstream chunks stream every cycle while the "
        "eight 4 B acks pace the upstream response channel.")
    add('write_async',
        _make_write_check(4, 8, chunk_spacing=1),
        "32 B write at 8->4 with async downstream acks (GRANTED + resp()): "
        "exercises the adapter's async write-ack path.")
    add('err_read',
        _make_read_check(2, 0),
        "The beat slave reports IO_RESP_INVALID inline on the read "
        "descriptor: both upstream beats carry the error, no data stream.")
    add('zero_read',
        _make_read_check(1, 1),
        "Degenerate zero-size read: exactly one is_first=is_last zero-size "
        "beat on each side.")
    add('zero_write',
        _make_write_check(1, 1),
        "Degenerate zero-size write: one zero-size chunk, one zero-size ack.")
    add('bp_read',
        _make_bp_check(4, 1),
        "32 B read at 8->4 with one wide beat back-pressured by the master: "
        "the adapter holds the exact beat and re-sends it on resp_retry().")
    add('deny_read',
        _make_deny_check(4, 1, expect_reqhold=True),
        "The target denies the forwarded read descriptor once: the adapter "
        "propagates the DENY upstream (REQHOLD) and forwards the retry.")
    add('deny_write',
        _make_deny_check(4, 1, expect_reqhold=False),
        "The target denies the first write chunk once: the adapter holds it "
        "and re-sends it synchronously inside retry().")
    add('read_upsize_fifo',
        _make_read_check(16, 8, up_spacing=1, dn_spacing=1, forbid_bhold=True),
        "64 B read at 4->8 with read_fifo_depth=16: the FIFO absorbs the "
        "whole repacked burst, so the wide downstream streams every cycle "
        "with no back-pressure (contrast with read_upsize).")
    add('write_beats_downsize_fifo',
        _make_write_check(4, 8, chunk_spacing=1, forbid_reqhold=True),
        "Beat-form 32 B write at 8->4 with write_fifo_depth=8: the FIFO "
        "absorbs the whole burst at the upstream rate, so the writer streams "
        "every cycle with no REQHOLD (contrast with write_beats_downsize).")
