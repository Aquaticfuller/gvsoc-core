from gvtest.testsuite import *

import re

SEND_RX = re.compile(r'^\[(\d+)\] master SEND ', re.MULTILINE)
RESP_RX = re.compile(r'^\[(\d+)\] master RESP .* status=(\d)', re.MULTILINE)
DONE_RX = re.compile(r'^\[(\d+)\] master DONE .* status=(\d)', re.MULTILINE)
QUIT_RX = re.compile(r'^\[\d+\] master QUIT', re.MULTILINE)
REQHOLD_RX = re.compile(r'^\[\d+\] master REQHOLD ', re.MULTILINE)
TGT_REQ_RX = re.compile(r'^\[\d+\] target REQ .* size=(\d+) ', re.MULTILINE)
TGT_DENY_RX = re.compile(r'^\[\d+\] target DENY ', re.MULTILINE)
TGT_RETRY_RX = re.compile(r'^\[\d+\] target RETRY', re.MULTILINE)


def _make_check(resp=0, done=0, chunk_sizes=None, reqholds=None, denies=0):
    """Assert the run finished with exactly `resp` async and `done` inline
    completions, and — the point of the adapter — that the fabric saw exactly
    the expected granule-aligned chunks (`chunk_sizes`, in arrival order,
    including re-sends after a deny). The granule/identity/data checks live in
    the stubs' traces.assert (asserts mode).

    reqholds=N pins the number of upstream back-pressure events (None = don't
    check); denies=N pins the downstream deny/retry handshakes."""
    def _check(test, output, *args, **kwargs):
        if not QUIT_RX.search(output):
            return False, 'no master QUIT line (sim aborted, hung, or assert fired)'
        resps = RESP_RX.findall(output)
        dones = DONE_RX.findall(output)
        if len(resps) != resp:
            return False, f'got {len(resps)} async completions, expected {resp}'
        if len(dones) != done:
            return False, f'got {len(dones)} inline completions, expected {done}'
        if chunk_sizes is not None:
            seen = [int(s) for s in TGT_REQ_RX.findall(output)]
            if seen != list(chunk_sizes):
                return False, f'fabric saw chunks {seen}, expected {list(chunk_sizes)}'
        if reqholds is not None:
            n_hold = len(REQHOLD_RX.findall(output))
            if n_hold != reqholds:
                return False, f'got {n_hold} REQHOLDs, expected {reqholds}'
        n_deny = len(TGT_DENY_RX.findall(output))
        n_retry = len(TGT_RETRY_RX.findall(output))
        if n_deny != denies or n_retry != denies:
            return False, (f'got {n_deny} denies / {n_retry} retries, '
                           f'expected {denies}')
        return True, f'{resp} async + {done} inline completions, chunks ok'
    return _check


def testset_build(testset):
    testset.set_name('io_v2_single_req_width_adapter')
    testset.set_components(["utils.io_v2_single_req_width_adapter"])

    def add(name, checker, desc):
        t = testset.new_make_test(name, flags=f'CASE={name}', checker=checker,
                                  build_resource='gvsoc.core.build', no_clean=True)
        t.add_description(desc)

    add('pt', _make_check(done=1, chunk_sizes=[4], reqholds=0),
        "Aligned granule-sized access: pure pass-through, one fabric access.")
    add('pt_fit', _make_check(done=1, chunk_sizes=[2], reqholds=0),
        "Unaligned access that still fits one granule: pass-through.")
    add('split2', _make_check(done=1, chunk_sizes=[4, 4], reqholds=0),
        "Aligned 8 B access on a 4 B granule: two chunks, one inline "
        "completion on the master's own request.")
    add('split_straddle', _make_check(done=1, chunk_sizes=[2, 2], reqholds=0),
        "The interleaved-fabric aliasing case: a 4 B access at offset 2 "
        "crosses the granule boundary and is chopped into 2+2.")
    add('split4', _make_check(done=1, chunk_sizes=[1, 4, 4, 1], reqholds=0),
        "Unaligned 10 B access at offset 3: granule-aligned chunks 1+4+4+1.")
    add('wsplit', _make_check(done=1, chunk_sizes=[4, 4], reqholds=0),
        "8 B write split into two chunks, each carrying the right slice of "
        "the master's buffer (pattern-checked by the fabric).")
    add('async_split', _make_check(resp=1, chunk_sizes=[4, 4], reqholds=0),
        "Chunks answered async: the split advances chunk by chunk and the "
        "master gets one response on its own object.")
    add('err_split', _make_check(done=1, chunk_sizes=[4, 4], reqholds=0),
        "IO_RESP_INVALID on the chunks is latched onto the master's request.")
    # Note: the fabric logs a REQ line for a denied arrival too, so the
    # chunk list includes the denied attempt followed by its re-send.
    add('deny_first', _make_check(done=1, chunk_sizes=[4, 4, 4], reqholds=1,
                                  denies=1),
        "First chunk denied: the split aborts statelessly, the DENY reaches "
        "the master (REQHOLD) and the re-sent access completes.")
    add('deny_mid', _make_check(resp=1, chunk_sizes=[4, 4, 4], reqholds=0,
                                denies=1),
        "Second chunk denied mid-split: the adapter holds it and re-sends it "
        "inside retry() — the master never sees back-pressure (and the "
        "completion is necessarily async).")
    add('busy', _make_check(resp=2, chunk_sizes=[4, 4, 4, 4], reqholds=1),
        "A second split-needing access while one is active is back-pressured "
        "and re-sent on the completion retry; both complete.")
    add('mixed', _make_check(resp=2, chunk_sizes=[4, 4, 4], reqholds=0),
        "A fitting access passes straight through while a split is in "
        "flight: fitting traffic is never blocked.")
