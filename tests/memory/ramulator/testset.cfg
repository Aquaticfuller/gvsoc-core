from gvtest.testsuite import *

import os
import re


# DRAMSys comparison cases need a SystemC-enabled build + libDRAMSys + configs
# (SYSTEMC_HOME / DRAMSYS_PATH). Skip them otherwise, like the dramsys testset.
DRAMSYS_AVAILABLE = bool(os.environ.get('SYSTEMC_HOME'))
DRAMSYS_SKIP = ('DRAMSys not prepared — set SYSTEMC_HOME/DRAMSYS_PATH and build '
                'gvsoc with SystemC (see tests/memory/dramsys).')


def _event_cycle(output, who, event, name):
    """Return the cycle of the first '[C] <who> <event> name=<name>' line."""
    rx = re.compile(rf'^\[(\d+)\] {re.escape(who)} {re.escape(event)} name={re.escape(name)}\b')
    for l in output.splitlines():
        m = rx.match(l)
        if m:
            return int(m.group(1))
    return None


def _resp_line(output, name):
    rx = re.compile(rf'^\[\d+\] master RESP name={re.escape(name)}\b.*$')
    for l in output.splitlines():
        if rx.match(l):
            return l
    return None


def _check_read_basic(test, output, *args, **kwargs):
    # Fresh memory holds 0x57 bytes; a 4-byte read at 0x0 must return
    # 0x57575757 with IO_RESP_OK, and the response must arrive strictly later
    # than the issue cycle (DRAM latency from Ramulator).
    send = _event_cycle(output, 'master', 'SEND', 'r')
    resp = _resp_line(output, 'r')
    if send is None or resp is None:
        return False, f'Missing SEND/RESP for "r" (send={send}, resp={resp})'
    if 'status=0' not in resp:
        return False, f'Expected status=0 (OK): {resp}'
    if 'data=57575757' not in resp:
        return False, f'Expected 0x57 init pattern: {resp}'
    resp_cycle = int(re.match(r'^\[(\d+)\]', resp).group(1))
    if resp_cycle <= send:
        return False, f'Response not delayed by DRAM latency (send={send}, resp={resp_cycle})'
    return True, f'read OK, init pattern, DRAM latency={resp_cycle - send} cycles'


def _check_write_then_read(test, output, *args, **kwargs):
    # Write 0xdeadbeef at 0x80, read it back: the read RESP must carry the
    # written bytes.
    r = _resp_line(output, 'r')
    if r is None:
        return False, 'No RESP line for "r"'
    if 'data=deadbeef' not in r:
        return False, f'Read did not return written pattern: {r}'
    return True, 'write-then-read round-trip preserves payload'


def _check_multi_tx(test, output, *args, **kwargs):
    # 128-byte read spans 2 DRAM transactions (64-byte tx / beat_width), so the
    # response streams back as 2 beats (one io_v2 resp each), the first beat
    # delayed by the DRAM latency.
    send = _event_cycle(output, 'master', 'SEND', 'r')
    r = _resp_line(output, 'r')
    if send is None or r is None:
        return False, f'Missing SEND/RESP for "r" (send={send}, resp={r})'
    if 'data=5757575757575757' not in r:
        return False, f'Read prefix mismatch: {r}'
    n_resp = len(re.findall(r'^\[\d+\] master RESP name=r\b', output, re.M))
    if n_resp != 2:
        return False, f'Expected 2 beats (128B / 64B beat_width), got {n_resp}'
    first_cycle = int(re.match(r'^\[(\d+)\]', r).group(1))
    if first_cycle <= send:
        return False, f'First beat not delayed by DRAM latency (send={send}, beat={first_cycle})'
    return True, f'128B read streamed as 2 beats, first-beat latency={first_cycle - send} cycles'


BEAT_WIDTH = 64
FREQ_GHZ = 1.2            # DDR4-2400 command clock
DDR4_2400_PEAK_BPC = 16   # bus peak: 2400 MT/s * 8 B / 1.2 GHz


def _beats(output, name):
    """Return [(cycle, size), ...] for every RESP beat of the named burst."""
    rx = re.compile(
        rf'^\[(\d+)\] master RESP name={re.escape(name)} .*\bsize=(\d+)\b')
    out = []
    for l in output.splitlines():
        m = rx.match(l)
        if m:
            out.append((int(m.group(1)), int(m.group(2))))
    return out


def _measure_bw(output, name):
    """Sustained bandwidth of a streamed burst, in (B/cycle, GB/s, n_beats).

    Measured over the beat-delivery window (first beat -> last beat), i.e. the
    steady-state streaming rate, excluding the one-off access latency before the
    first beat. Returns None if fewer than 2 beats.
    """
    beats = _beats(output, name)
    if len(beats) < 2:
        return None
    total = sum(s for _, s in beats)
    first_c, first_s = beats[0]
    last_c = beats[-1][0]
    span = last_c - first_c
    if span <= 0:
        return None
    bpc = (total - first_s) / span      # bytes after the first beat / window
    return bpc, bpc * FREQ_GHZ, len(beats)


def _check_bw(test, output, name, expected_beats):
    m = _measure_bw(output, name)
    if m is None:
        return False, f'Could not measure bandwidth for "{name}" (need >=2 beats)'
    bpc, gbps, n = m
    if n != expected_beats:
        return False, f'Expected {expected_beats} beats, got {n}'
    # Must move real data, never exceed the DRAM bus peak, and be strictly below
    # the raw 1-beat/cycle interconnect rate (proves Ramulator timing throttles).
    if not (0 < bpc < BEAT_WIDTH):
        return False, f'Bandwidth {bpc:.2f} B/cycle out of (0, {BEAT_WIDTH}) range'
    if bpc > DDR4_2400_PEAK_BPC + 1:
        return False, (f'Bandwidth {bpc:.2f} B/cycle exceeds DDR4-2400 bus peak '
                       f'{DDR4_2400_PEAK_BPC} B/cycle — DRAM timing not applied?')
    if bpc < 5:
        return False, (f'Bandwidth {bpc:.2f} B/cycle implausibly low for a '
                       f'sequential burst')
    frac = 100.0 * bpc / DDR4_2400_PEAK_BPC
    return True, (f'{n} beats, sustained {bpc:.2f} B/cycle = {gbps:.2f} GB/s '
                  f'({frac:.0f}% of DDR4-2400 peak)')


def _check_bw_read(test, output, *args, **kwargs):
    return _check_bw(test, output, 'r', expected_beats=64)


def _check_bw_write(test, output, *args, **kwargs):
    # Per-burst write acknowledgement: the master sees a single data-less ack
    # instead of a per-beat stream, so the sustained bandwidth is measured
    # from the SEND -> ack window (the ack fires on the cycle the last
    # per-beat ack fired before the protocol change, i.e. it carries the full
    # DRAM write timing).
    m_send = re.search(r'^\[(\d+)\] master SEND name=w .*size=(\d+)', output, re.M)
    acks = re.findall(r'^\[(\d+)\] master RESP name=w .*last=1', output, re.M)
    if not m_send or len(acks) != 1:
        return False, (f'Expected one SEND and exactly one write burst ack; '
                       f'got send={bool(m_send)} acks={len(acks)}')
    send_c = int(m_send.group(1))
    size = int(m_send.group(2))
    span = int(acks[0]) - send_c
    if span <= 0:
        return False, f'Non-positive write window ({span} cycles)'
    bpc = size / span
    gbps = bpc * FREQ_GHZ
    if not (0 < bpc < BEAT_WIDTH):
        return False, f'Bandwidth {bpc:.2f} B/cycle out of (0, {BEAT_WIDTH}) range'
    if bpc > DDR4_2400_PEAK_BPC + 1:
        return False, (f'Bandwidth {bpc:.2f} B/cycle exceeds DDR4-2400 bus peak '
                       f'{DDR4_2400_PEAK_BPC} B/cycle — DRAM timing not applied?')
    if bpc < 5:
        return False, (f'Bandwidth {bpc:.2f} B/cycle implausibly low for a '
                       f'sequential burst')
    frac = 100.0 * bpc / DDR4_2400_PEAK_BPC
    return True, (f'{size} B written in {span} cycles, {bpc:.2f} B/cycle = '
                  f'{gbps:.2f} GB/s ({frac:.0f}% of DDR4-2400 peak)')


def _check_transfer_2d(test, output, *args, **kwargs):
    # 2D transfer: 16 lines x 1 KiB. Each line is a burst streamed as 16 beats;
    # its final beat carries last=1, so there must be exactly 16 line-completions.
    n_last = len(re.findall(r'^\[\d+\] master RESP name=line\d+ .*\blast=1\b', output, re.M))
    if n_last != 16:
        return False, f'Expected 16 completed lines (last=1), got {n_last}'
    n_beats = len(re.findall(r'^\[\d+\] master RESP name=line\d+\b', output, re.M))
    if n_beats != 16 * 16:
        return False, f'Expected {16*16} beats (16 lines x 16 beats), got {n_beats}'
    return True, '2D transfer: 16x1KiB lines, each a distinct bank (16 beats/line)'


def testset_build(testset):
    testset.set_name('ramulator')
    components = ["memory.ramulator"]
    if DRAMSYS_AVAILABLE:
        components.append("memory.dramsys_v2")
    testset.set_components(components)

    t = testset.new_make_test('read_basic', flags='CASE=read_basic',
                              checker=_check_read_basic,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "4-byte read from a freshly-initialised (0x57) Ramulator-backed "
        "memory. Validates io_v2 GRANTED->resp handling, the functional "
        "backing store, and that Ramulator applies a non-zero DRAM latency "
        "(RESP cycle strictly after the issue cycle)."
    )

    t = testset.new_make_test('write_then_read', flags='CASE=write_then_read',
                              checker=_check_write_then_read,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "Write 0xdeadbeef then read it back. Validates that writes land in "
        "the backing store and reads observe them after the DRAM round-trip."
    )

    t = testset.new_make_test('multi_tx', flags='CASE=multi_tx',
                              checker=_check_multi_tx,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "128-byte read split into two 64-byte DRAM transactions. Validates "
        "the request-splitting path and that a multi-transaction request "
        "surfaces as exactly one io_v2 response once all sub-transactions "
        "complete in Ramulator."
    )

    t = testset.new_make_test('bw_read', flags='CASE=bw_read',
                              checker=_check_bw_read,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "Sustained read bandwidth: one 4 KiB sequential read burst streamed as "
        "64 beats. Measures B/cycle over the beat-delivery window and checks it "
        "is data-bearing, below the raw 1-beat/cycle interconnect rate, and "
        "within the DDR4-2400 bus peak (~16 B/cycle) — i.e. throttled by "
        "Ramulator's DRAM timing (tCCD), not the wrapper."
    )

    t = testset.new_make_test('bw_write', flags='CASE=bw_write',
                              checker=_check_bw_write,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "Sustained write bandwidth: one 4 KiB sequential write burst consumed "
        "as 64 per-cycle beats. Same bandwidth bounds as bw_read."
    )

    # Same bandwidth workload on DRAMSys (DDR4), for a Ramulator-vs-DRAMSys
    # comparison on the same DDR4 read burst. Selected via MEM=dramsys.
    t = testset.new_make_test('bw_read_dramsys', flags='CASE=bw_read MEM=dramsys',
                              checker=_check_bw_read,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "Sustained read bandwidth on the DRAMSys DDR4 model, using the same "
        "beat master + 4 KiB read burst as bw_read. Lets Ramulator and DRAMSys "
        "be compared on the same DDR4 workload and methodology."
    )
    if not DRAMSYS_AVAILABLE:
        t.skip(DRAMSYS_SKIP)

    t = testset.new_make_test('transfer_2d', flags='CASE=transfer_2d',
                              checker=_check_transfer_2d,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "2D transfer: 16 lines of 1 KiB, line pitch 0x2000 so each line lands "
        "on a distinct DRAM bank (bank/bankgroup field = byte bits 13-16). Each "
        "line is one burst streamed as 16 beats. Validates bank-parallel 2D "
        "traffic; in the GUI all 16 per-bank command lanes show ACT/RD."
    )
