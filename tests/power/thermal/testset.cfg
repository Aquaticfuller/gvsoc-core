from gvtest.testsuite import *

import os
import re


# Verbose line printed by the thermal model on each update:
# [<time_ps>] thermal <name> power_w=<power> temp_c=<temp>
_LINE_RX = re.compile(
    r'^\[(\d+)\] thermal (\w+) power_w=([-+\d.eE]+) temp_c=([-+\d.eE]+)$')


def _thermal_updates(output: str, name: str) -> list:
    """All (time_ps, power_w, temp_c) updates of the named sync point."""
    updates = []
    for line in output.splitlines():
        m = _LINE_RX.match(line)
        if m and m.group(2) == name:
            updates.append((int(m.group(1)), float(m.group(3)), float(m.group(4))))
    return updates


def _find_power_report(test) -> str | None:
    """Locate the power_report.csv produced by the capture run.

    The checker receives a TestRun whose .test is the MakeTest, whose
    .path is the test directory. gvsoc dumps the report in its working
    directory, which the Makefile sets to build/work/<case>.
    """
    test_dir = getattr(getattr(test, 'test', test), 'path', None)
    if not isinstance(test_dir, str):
        return None
    candidate = os.path.join(test_dir, 'build', 'work', 'capture',
                             'power_report.csv')
    return candidate if os.path.exists(candidate) else None


def _check_heating(test, output, *args, **kwargs):
    # Constant write traffic into mem0 (0.25 W dynamic per period), mem1
    # idle. mem0 must ramp up through the RC model, mem1 must stay at
    # ambient, and mem0's reported power must grow with its temperature
    # (leakage feedback through the power tables).
    mem0 = _thermal_updates(output, 'mem0')
    mem1 = _thermal_updates(output, 'mem1')
    if len(mem0) < 10 or len(mem1) < 10:
        return False, (f'Expected at least 10 thermal updates, got '
                       f'mem0={len(mem0)} mem1={len(mem1)}')

    temps0 = [u[2] for u in mem0]
    if temps0[0] > 40.0:
        return False, f'mem0 heated up too fast on first update: {temps0[0]}'
    if max(temps0) < 42.0:
        return False, f'mem0 did not heat up enough: max temp {max(temps0)}'
    # While traffic is constant (updates 0..9 are full-traffic periods),
    # the temperature must rise monotonically towards the RC target
    for i in range(1, 10):
        if temps0[i] <= temps0[i - 1]:
            return False, (f'mem0 temperature not increasing under constant '
                           f'traffic at update {i}: {temps0}')

    temps1 = [u[2] for u in mem1]
    if max(temps1) > 27.0:
        return False, f'idle mem1 did not stay at ambient: max temp {max(temps1)}'

    # Feedback: same write traffic on updates 1 and 7, but update 7 runs
    # ~10-20 degrees hotter, so its power must be higher by the leakage
    # slope (0.002 W/K)
    power_delta = mem0[7][1] - mem0[1][1]
    if power_delta < 0.01:
        return False, (f'mem0 power did not increase with temperature '
                       f'(delta: {power_delta}), set_temperature seems inert')

    return True, (f'mem0 heated {temps0[0]:.1f}->{max(temps0):.1f}C '
                  f'(mem1 idle at {max(temps1):.1f}C), '
                  f'leakage feedback +{power_delta*1000:.1f}mW')


def _check_capture(test, output, *args, **kwargs):
    # A --power capture (magic writes) runs concurrently with the thermal
    # loop. Both must stay correct: the thermal sampling must not be
    # reset by the capture start, and the capture report must cover its
    # full window even though thermal updates happened inside it.
    mem0 = _thermal_updates(output, 'mem0')
    if len(mem0) < 4:
        return False, f'Expected at least 4 thermal updates, got {len(mem0)}'

    # Update 2 covers cycles 100-200: 17 writes (0.085 W) all before the
    # capture start at cycle 160. If the capture start had reset the
    # thermal sampling, the update would only see the quiet 160-200 range
    # (~0.01 W dynamic).
    if mem0[1][1] < 0.05:
        return False, (f'thermal power reading was disturbed by the capture '
                       f'start: {mem0[1][1]} W')

    # The capture measure line reports the average power on the capture
    # window (cycles 160-380)
    m = re.search(r'@power\.measure_0@([-+\d.eE]+)@', output)
    if m is None:
        return False, 'No power measure line found, capture did not run'
    measure = float(m.group(1))
    if measure < 0.01:
        return False, f'Capture average power too low: {measure} W'

    # The mem0 row of the report must cover the full capture window:
    # 18 writes between cycles 160 and 380 -> ~0.04 W dynamic. If the
    # thermal updates at cycles 200/300 had truncated the window, only
    # the cap_stop write would remain (~0.006 W).
    report = _find_power_report(test)
    if report is None:
        return False, 'power_report.csv not found'
    with open(report, encoding='utf-8') as file_desc:
        rows = [l for l in file_desc if 'mem0' in l and 'power_trace' in l]
    if not rows:
        return False, f'No mem0 row in {report}'
    dynamic = float(rows[0].split(';')[1])
    if dynamic < 0.02:
        return False, (f'mem0 capture window was truncated by the thermal '
                       f'updates: dynamic power {dynamic} W')

    return True, (f'capture and thermal loop coexist (thermal read '
                  f'{mem0[1][1]:.3f}W, capture mem0 {dynamic:.3f}W, '
                  f'global {measure:.3f}W)')


def testset_build(testset):
    testset.set_name('thermal')
    testset.set_components(["thermal.thermal_model"])

    t = testset.new_make_test('heating', flags='CASE=heating',
                              checker=_check_heating,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "Constant write traffic into mem0, mem1 idle, both watched by the "
        "thermal model. mem0 must ramp up through the built-in RC thermal "
        "simulator while mem1 stays at ambient, and mem0's sampled power "
        "must grow across updates by the leakage temperature slope — which "
        "proves the temperatures are actually applied back to the power "
        "sources."
    )

    t = testset.new_make_test('capture', flags='CASE=capture',
                              checker=_check_capture,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "Runs a --power capture (magic-write triggered) in the middle of "
        "the thermal loop. The thermal power sampling uses the never-reset "
        "total energy counters, so the capture start must not perturb the "
        "thermal readings, and the thermal updates must not truncate the "
        "capture report window."
    )
